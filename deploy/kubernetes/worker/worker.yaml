# The job queue worker: indexing, OCR of scanned PDFs, transcription, audio overviews, mind maps,
# reports, images, connector syncs, chat-app answers and evaluations. Jobs are claimed with
# FOR UPDATE SKIP LOCKED, so several replicas are safe; model quotas usually run out before CPU does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corpus-worker
  labels:
    app.kubernetes.io/name: corpus
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: corpus
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corpus
        app.kubernetes.io/component: worker
    spec:
      # On SIGTERM the worker takes no new job and finishes the current one (at most two minutes).
      terminationGracePeriodSeconds: 150
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: corpus
          imagePullPolicy: Always
          command: ['node', '--conditions=react-server', 'dist/scripts/worker.cjs']
          # POSTGRES_URL, AUTH_SECRET, APP_URL, GOOGLE_API_KEY and the optional settings: the same
          # values as the web app (the worker refreshes Google Drive tokens and links notifications).
          envFrom:
            - secretRef:
                name: corpus-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # OCR of scanned pages and audio encoding are the peaks.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # Language data for OCR_LANGUAGES other than English is cached here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
