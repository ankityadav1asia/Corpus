# Applies pending schema migrations (idempotent and locked). Run it before each release when the web
# app runs on Kubernetes; on Vercel, production builds migrate by themselves (scripts/vercel-build.mjs).
# A Job cannot be changed once created, so delete the previous run first:
#
#   kubectl -n corpus delete job corpus-migrate --ignore-not-found
#   kubectl apply -f deploy/kubernetes/migrate-job.yaml
#   kubectl -n corpus wait --for=condition=complete job/corpus-migrate --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: corpus-migrate
  namespace: corpus
  labels:
    app.kubernetes.io/name: corpus
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corpus
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # The same image (and tag) as the release it prepares.
          image: ghcr.io/ankityadav1asia/corpus:main
          imagePullPolicy: Always
          command: ['node', '--conditions=react-server', 'dist/scripts/init-db.cjs']
          envFrom:
            - secretRef:
                name: corpus-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
