# The web server (pages, API, streaming answers). The worker Deployment processes the job queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corpus-web
  labels:
    app.kubernetes.io/name: corpus
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: corpus
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corpus
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: corpus
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: corpus-env
          env:
            # The ingress controller appends the client address to X-Forwarded-For (per-IP rate limits).
            # Use 2 when a load balancer or CDN that also appends it sits in front.
            - name: TRUST_PROXY
              value: '1'
            # The worker Deployment processes the job queue: OCR, transcription and audio stay out of here.
            - name: WEB_RUNS_JOBS
              value: 'false'
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # A process check only: a database outage must not restart the web servers.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Text extraction of large PDFs during uploads is the peak.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js keeps its runtime cache in .next, the only folder the image lets the app write.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: corpus-web
  labels:
    app.kubernetes.io/name: corpus
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: corpus
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
