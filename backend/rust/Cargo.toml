[package]
name = "corpus-core"
version = "0.1.0"
edition = "2021"
description = "Corpus RAG core: text splitting, rank fusion, the relevance guardrail and prompt escaping. Built to WebAssembly for the Go backend."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
