# Every push and pull request: the same checks as `npm run typecheck && npm run lint && npm test`,
# a production build and a dependency audit. Vercel builds and deploys `main` on its own (vercel.json).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # Offline: PGlite database and a fake AI provider, no secrets needed.
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust core (tests and WebAssembly build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/rust
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain with the WebAssembly target
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown && rustup default stable
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the golden tests: every output must equal the TypeScript code's (tests/fixtures/golden.json).
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-core-wasm
          path: backend/rust/target/wasm32-unknown-unknown/release/corpus_core.wasm
          if-no-files-found: error

  go:
    name: Go API (vet, tests against PostgreSQL, build)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v5
        with:
          name: corpus-core-wasm
          path: backend/internal/core
      - name: Fixtures are up to date with the TypeScript code
        run: npm run core:fixtures && git diff --exit-code -- backend/rust/tests/fixtures backend/internal/auth/testdata
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: backend
        run: go vet ./...
      # A migrated PostgreSQL (PGlite + pgvector) on a local port for the database tests.
      - name: Start the test database
        run: |
          npm run db:pglite-server > pglite.log 2>&1 &
          for i in $(seq 1 60); do grep -q READY pglite.log && break; sleep 1; done
          grep READY pglite.log
      - name: go test
        working-directory: backend
        env:
          CORPUS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres?sslmode=disable
        run: go test -count=1 ./...
      - name: Build the API container
        run: docker build -t corpus-api backend
