# Render Blueprint: the web server and the background worker, both built from ./Dockerfile.
# First deploy, secrets and migrations: docs/DEPLOYMENT.md.
#
# Secrets are entered once, on the web service (Render asks for every `sync: false` value when the
# Blueprint is created); the worker copies them from it. AUTH_SECRET is generated by Render.

services:
  - type: web
    name: corpus-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Next to Neon's us-east-2 (Ohio) database: every query is a round trip.
    region: ohio
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    # Applies pending schema migrations before the new version takes traffic (idempotent, locked).
    preDeployCommand: node --conditions=react-server dist/scripts/init-db.cjs
    autoDeployTrigger: checksPass
    envVars:
      - key: POSTGRES_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Render's proxy appends the client address to X-Forwarded-For (per-IP rate limits).
      - key: TRUST_PROXY
        value: '1'
      # The worker below processes the job queue; keep OCR, transcription and audio out of the web server.
      - key: WEB_RUNS_JOBS
        value: 'false'

  - type: worker
    name: corpus-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node --conditions=react-server dist/scripts/worker.cjs
    region: ohio
    # OCR of scanned PDFs, transcription and audio overviews need more memory than the web server.
    plan: 1c-2g
    # A job in progress may take up to two minutes; the worker takes no new job once asked to stop.
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: checksPass
    envVars:
      - key: POSTGRES_URL
        fromService:
          type: web
          name: corpus-web
          envVarKey: POSTGRES_URL
      - key: APP_URL
        fromService:
          type: web
          name: corpus-web
          envVarKey: APP_URL
      - key: GOOGLE_API_KEY
        fromService:
          type: web
          name: corpus-web
          envVarKey: GOOGLE_API_KEY
      - key: AUTH_SECRET
        fromService:
          type: web
          name: corpus-web
          envVarKey: AUTH_SECRET
